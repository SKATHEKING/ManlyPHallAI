name: Tests

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run unit tests
      run: |
        pytest tests/test_ingestion.py -v --tb=short

    - name: Run E2E API tests (without Ollama)
      run: |
        pytest tests/test_e2e_api.py::TestAPIStatusEndpoint -v --tb=short
        pytest tests/test_e2e_api.py::TestAPIErrorHandling -v --tb=short

    - name: Lint with pylint
      run: |
        pylint backend/ --exit-zero --disable=all --enable=E,F
      continue-on-error: true

    - name: Format check with black
      run: |
        black --check backend/ bot/ --line-length=100
      continue-on-error: true

    - name: Import sort check with isort
      run: |
        isort --check-only backend/ bot/
      continue-on-error: true

    - name: Type check with mypy
      run: |
        mypy backend/ --ignore-missing-imports
      continue-on-error: true

    - name: Test coverage
      run: |
        pytest tests/test_ingestion.py --cov=backend --cov-report=term-missing
      continue-on-error: true

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit

    - name: Run Bandit security scan
      run: |
        bandit -r backend/ bot/ --severity-level medium
      continue-on-error: true
